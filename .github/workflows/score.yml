name: Registrar pontuação

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# uma pontuação por vez, para o arquivo não conflitar
concurrency:
  group: scores
  cancel-in-progress: false

jobs:
  record:
    if: startsWith(github.event.issue.title, '[score]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Validar e registrar
        id: rec
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: node .github/scripts/score.js
        continue-on-error: true
      - name: Publicar placar
        if: steps.rec.outcome == 'success'
        run: |
          git config user.name "cacarejo-bot"
          git config user.email "cacarejo-bot@users.noreply.github.com"
          git add data/scores.json
          git commit -m "placar: ${{ github.event.issue.user.login }}" || exit 0
          git push
      - name: Responder e fechar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MSG="$(cat /tmp/score_msg.txt 2>/dev/null || echo 'Não consegui processar este envio.')"
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "$MSG"
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
